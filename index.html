<!DOCTYPE html>
<html>
  <head>
    <title>Eindopdracht</title>
    <link rel="stylesheet" href="main.css" type="text/css" />
  </head>
  <body>
    <script src="eindopdracht.js"></script>

    <script async type="module">
      import conn from "./database.js";
      import queries from "./queries.js";

      const is_string = (s) => typeof s === "string" || s instanceof String;
      const is_array = (a) => Array.isArray(a) && is_string(a[0]);

      const serialize = (d) => {
        if (is_string(d)) return d;
        if (is_array(d)) return d.join(", ");
        else return JSON.stringify(d, undefined, 2);
      };

      for (const query of queries) {
        const containerElement = document.createElement("section");
        const questionHeader = document.createElement("header");
        const anwserHeader = document.createElement("header");
        const questionElement = document.createElement("div");
        const anwserElement = document.createElement("div");

        questionHeader.textContent = "Vraag";
        questionElement.textContent = query.title;
        anwserHeader.textContent = "Antwoord";

        try {
          const result = await conn.query(query.query);
          anwserElement.textContent = serialize(result);
        } catch (e) {
          console.error(e.message);
          anwserElement.textContent = serialize(e.message);
        }

        containerElement.appendChild(questionHeader);
        containerElement.appendChild(questionElement);
        containerElement.appendChild(anwserHeader);
        containerElement.appendChild(anwserElement);

        document.body.appendChild(containerElement);
      }
    </script>
  </body>
</html>
